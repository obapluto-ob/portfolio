<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000d00"/>
      <stop offset="100%" style="stop-color:#001a00"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff41;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0"/>
    </linearGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Scanlines -->
  <rect width="1200" height="630" fill="none" stroke="#00ff41" stroke-width="0.3" opacity="0.03"
    style="background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.03) 2px, rgba(0,255,65,0.03) 4px)"/>

  <!-- Grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>

  <!-- Top border glow line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow)"/>
  <!-- Bottom border glow line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="60" y="80" width="3" height="470" fill="#00ff41" opacity="0.6"/>

  <!-- Terminal window header -->
  <rect x="80" y="80" width="680" height="36" rx="6" fill="rgba(0,255,65,0.06)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Traffic lights -->
  <circle cx="104" cy="98" r="7" fill="#ff5f57"/>
  <circle cx="126" cy="98" r="7" fill="#febc2e"/>
  <circle cx="148" cy="98" r="7" fill="#28c840"/>
  <text x="170" y="103" font-family="monospace" font-size="13" fill="#00ff41" opacity="0.5">portfolio.sh — bash</text>

  <!-- Terminal content -->
  <!-- Line 1 -->
  <text x="96" y="158" font-family="monospace" font-size="15" fill="#00cc33" opacity="0.7">obapluto@portfolio</text>
  <text x="270" y="158" font-family="monospace" font-size="15" fill="#666">~$</text>
  <text x="292" y="158" font-family="monospace" font-size="15" fill="#00ff41">whoami</text>
  <text x="96" y="180" font-family="monospace" font-size="15" fill="#a3e8b0">Obed Emoni Lopeyok</text>

  <!-- Line 2 -->
  <text x="96" y="212" font-family="monospace" font-size="15" fill="#00cc33" opacity="0.7">obapluto@portfolio</text>
  <text x="270" y="212" font-family="monospace" font-size="15" fill="#666">~$</text>
  <text x="292" y="212" font-family="monospace" font-size="15" fill="#00ff41">cat role.txt</text>
  <text x="96" y="234" font-family="monospace" font-size="15" fill="#a3e8b0">Full-stack Developer</text>

  <!-- Line 3 -->
  <text x="96" y="266" font-family="monospace" font-size="15" fill="#00cc33" opacity="0.7">obapluto@portfolio</text>
  <text x="270" y="266" font-family="monospace" font-size="15" fill="#666">~$</text>
  <text x="292" y="266" font-family="monospace" font-size="15" fill="#00ff41">cat stack.txt</text>
  <text x="96" y="288" font-family="monospace" font-size="15" fill="#a3e8b0">React · TypeScript · Python · Flutter · Node.js</text>

  <!-- Line 4 -->
  <text x="96" y="320" font-family="monospace" font-size="15" fill="#00cc33" opacity="0.7">obapluto@portfolio</text>
  <text x="270" y="320" font-family="monospace" font-size="15" fill="#666">~$</text>
  <text x="292" y="320" font-family="monospace" font-size="15" fill="#00ff41">cat status.txt</text>
  <text x="96" y="342" font-family="monospace" font-size="15" fill="#00ff41" filter="url(#greenGlow)">Available for hire — open to remote &amp; on-site ▌</text>

  <!-- Right panel — name card -->
  <rect x="820" y="80" width="320" height="470" rx="8" fill="rgba(0,255,65,0.04)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Name -->
  <text x="980" y="160" font-family="monospace" font-size="22" font-weight="bold" fill="#00ff41" text-anchor="middle" filter="url(#greenGlow)">OBED EMONI</text>
  <text x="980" y="190" font-family="monospace" font-size="22" font-weight="bold" fill="#00ff41" text-anchor="middle" filter="url(#greenGlow)">LOPEYOK</text>

  <!-- Divider -->
  <line x1="850" y1="210" x2="1110" y2="210" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>

  <!-- Role -->
  <text x="980" y="240" font-family="monospace" font-size="14" fill="#a3e8b0" text-anchor="middle">Full-stack Developer</text>
  <text x="980" y="262" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">Nairobi, Kenya</text>

  <!-- Tech badges -->
  <rect x="848" y="285" width="72" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="884" y="302" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">React</text>

  <rect x="928" y="285" width="96" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="976" y="302" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">TypeScript</text>

  <rect x="1032" y="285" width="72" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="1068" y="302" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">Python</text>

  <rect x="848" y="317" width="72" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="884" y="334" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">Flutter</text>

  <rect x="928" y="317" width="80" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="968" y="334" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">Node.js</text>

  <rect x="1016" y="317" width="88" height="24" rx="4" fill="rgba(0,255,65,0.1)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="1060" y="334" font-family="monospace" font-size="11" fill="#00ff41" text-anchor="middle">PostgreSQL</text>

  <!-- Divider -->
  <line x1="850" y1="360" x2="1110" y2="360" stroke="#00ff41" stroke-width="0.5" opacity="0.2"/>

  <!-- Projects count -->
  <text x="980" y="395" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">7 production projects</text>
  <text x="980" y="418" font-family="monospace" font-size="13" fill="#666" text-anchor="middle">open to full-time &amp; freelance</text>

  <!-- URL -->
  <text x="980" y="490" font-family="monospace" font-size="12" fill="#00ff41" text-anchor="middle" opacity="0.6">obapluto-ob.github.io/portfolio</text>

  <!-- Bottom status bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="80" y="615" font-family="monospace" font-size="12" fill="#00ff41" opacity="0.5">● SYSTEM ONLINE</text>
  <text x="600" y="615" font-family="monospace" font-size="12" fill="#666" text-anchor="middle">github.com/obapluto-ob</text>
  <text x="1120" y="615" font-family="monospace" font-size="12" fill="#00ff41" opacity="0.5" text-anchor="end">ACCESS GRANTED</text>
</svg>
